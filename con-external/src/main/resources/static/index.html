<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIBLIO</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="contenedor-principal">
    <div class="grid-dos-columnas">

        <div class="tarjeta tarjeta-registro">
            <div class="encabezado-tarjeta">REGISTRAR LIBRO</div>

            <div class="cuerpo-tarjeta">
                <label>ISBN</label>
                <input type="text" id="isbn-reg" placeholder="EJ: 978-84-001">

                <label>TÍTULO</label>
                <input type="text" id="nome-reg" placeholder="EJ: EL PRINCIPITO">

                <label>AUTOR</label>
                <input type="text" id="autor-reg" placeholder="EJ: MALÚ">

                <button class="btn-guardar" onclick="guardarLibro()">GUARDAR EN BD</button>

                <div id="msg-registro" class="caja-mensaje"></div>
            </div>
        </div>

        <div class="tarjeta tarjeta-buscador">
            <div class="encabezado-tarjeta">BUSCADOR DE LIBROS</div>

            <div class="cuerpo-tarjeta">
                <label>BUSCAR POR ISBN</label>
                <input type="text" id="isbn-busqueda" placeholder="EJ: 978-84-001">
                <button class="btn-buscar" onclick="buscarLibro()">BUSCAR ISBN</button>

                <hr style="border: 2px solid black; margin: 30px 0;">

                <label>BUSCAR POR NOMBRE</label>
                <input type="text" id="nome-busqueda" placeholder="EJ: EL PRINCIPITO">
                <button class="btn-buscar" style="background-color: #9900ff;" onclick="buscarLibroNombre()">BUSCAR NOMBRE</button>

                <div id="msg-busqueda" class="caja-mensaje"></div>
            </div>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
